name: Sync upstream without AI
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: upstream-no-ai
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'peplxx/oleafly-no-ai'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      NODE_OPTIONS: --max-old-space-size=6144
      TAURI_CONFIG: '{"bundle":{"externalBin":[],"resources":[]}}'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Configure merge identity
        run: |
          git config user.name 'peplxx'
          git config user.email '91543105+peplxx@users.noreply.github.com'
      - name: Prepare ordinary Git merge
        id: merge
        run: python3 scripts/no-ai/sync-upstream.py prepare
      - name: Require updater signing key
        if: steps.merge.outputs.dispatch == 'true' || steps.merge.outputs.rerun != ''
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY repository secret before syncing a release."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        if: steps.merge.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.merge.outputs.ready == 'true'
        with:
          node-version: '24'
          cache: pnpm
      - name: Install native build prerequisites
        if: steps.merge.outputs.ready == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libasound2-dev
      - uses: ./.github/actions/rust-toolchain
        if: steps.merge.outputs.ready == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.merge.outputs.ready == 'true'
        with:
          workspaces: . -> src-tauri/target
      # build.rs stages these tools on Linux even when Tauri bundling is disabled.
      - name: Fetch tools required by the Linux build script
        if: steps.merge.outputs.ready == 'true'
        run: |
          bash scripts/fetch-tectonic.sh x86_64-unknown-linux-gnu
          bash scripts/fetch-pandoc.sh x86_64-unknown-linux-gnu
          bash scripts/fetch-typst.sh x86_64-unknown-linux-gnu
      - name: Verify merged tree
        if: steps.merge.outputs.ready == 'true'
        run: |
          node scripts/no-ai/check.mjs
          pnpm install --frozen-lockfile
          pnpm build
          pnpm test
          cargo check --workspace --tests --locked
          python3 -m unittest discover -s scripts/no-ai -p '*_test.py'
      - name: Push verified merge and fork tag
        if: steps.merge.outputs.ready == 'true'
        run: python3 scripts/no-ai/sync-upstream.py publish-merge
      - name: Start signed release
        if: steps.merge.outputs.dispatch == 'true'
        env:
          FORK_TAG: ${{ steps.merge.outputs.tag }}
        run: gh workflow run release.yml --ref main -f tag="$FORK_TAG" -f publish=true
      - name: Retry failed release jobs
        if: steps.merge.outputs.rerun != ''
        env:
          RELEASE_RUN_ID: ${{ steps.merge.outputs.rerun }}
        run: gh run rerun "$RELEASE_RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
